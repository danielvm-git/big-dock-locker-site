name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight (typecheck + test + lint + build)
        run: npm run preflight

      - name: Upload site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist/
          retention-days: 3

  # story: e03s02 — the Playwright suite is part of the CI contract. `preflight`
  # does not include it, so without this job the browser flow had no gate.
  #
  # The job runs in the official Playwright image so the browsers and their
  # system libraries are already present. Installing them per-run via
  # `npx playwright install --with-deps` was measured at 29s once and >10min on
  # another run, which hit timeout-minutes and surfaced as `cancelled`.
  #
  # The image tag must match @playwright/test in package-lock.json;
  # tests/unit/ciWiring.test.ts fails if the two drift apart.
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # playwright.config.ts serves `npm run preview`, which needs dist/.
      - name: Build
        run: npm run build

      - name: Playwright E2E
        run: npm run test:e2e

  # Deploys the dist/ that passed preflight and e2e, and only from main.
  deploy:
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: danielvm-git/.github/.github/workflows/deploy-cloudflare-pages.yml@0dc0feae39d0bb932a0999ee4f8dde35fb1b702d # danielvm-git/.github main (#46)
    with:
      project: danielvm-docklocker
      domain: docklocker.danielvm.net
    secrets: inherit
