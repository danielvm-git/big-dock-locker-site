# Branch configuration
branches:
  - main

# Tag format
tagFormat: 'v${version}'

# Plugins
# The top-level versionFile block auto-adds the versionfile plugin and inserts
# it before git (big-release v2.8.1+), so PostPublish writes VERSION before
# the git plugin commits postTagAssets.
plugins:
  - changelog
  - git
  - github

# Version file sync (big-release v2.8.1+)
versionFile:
  path: VERSION
  template: '{{.Version}}'

pluginConfigs:
  git:
    postTagAssets:
      - VERSION

# Commit type sections in changelog
commitTypes:
  - type: feat
    section: Features
  - type: fix
    section: Bug Fixes
  - type: perf
    section: Performance
  - type: revert
    section: Reverts
  - type: docs
    hidden: true
  - type: chore
    hidden: true
  - type: refactor
    hidden: true
