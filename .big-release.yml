# Branch configuration
branches:
  - main

# Tag format
tagFormat: 'v${version}'

# Plugins
# versionfile must run before git: both implement PostPublish, and the git
# plugin commits postTagAssets after versionfile writes the file.
plugins:
  - changelog
  - versionfile
  - git
  - github

# Version file sync (big-release v2.3.0+)
pluginConfigs:
  versionfile:
    path: VERSION
    template: '{{.Version}}'
  git:
    postTagAssets:
      - VERSION

# Commit type sections in changelog
commitTypes:
  - type: feat
    section: Features
  - type: fix
    section: Bug Fixes
  - type: perf
    section: Performance
  - type: revert
    section: Reverts
  - type: docs
    hidden: true
  - type: chore
    hidden: true
  - type: refactor
    hidden: true
