    reason: 'RCA verified read-only 2026-11-08: getSite shows build_settings.repo_url set and stop_builds=false but installation_id=null and deploy_key_id=null, so the Netlify GitHub App installation is deauthorised; listHooksBySiteId has no build hook; repo hooks are Snyk only. 77 commits on main since the last deploy (77d72ae, 2026-05-21) produced no builds, and the live site still serves assets/index-COMqoqnk.js while main builds assets/index-86qctmDw.js. Every remediation (re-link the GitHub App via interactive OAuth, create a build hook plus a repo secret, or add NETLIFY_AUTH_TOKEN and a CI deploy) mutates production infrastructure or creates a secret, which the run approval (commit/push/PR/merge/remove merged worktrees) does not cover. This is the stated stop condition "a failure is external ... or needs my credentials". Per the Never clause, BUG-008 was not weakened into an always-passing gate to work around it.'
