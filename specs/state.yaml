    status: 'accepted'
  - id: 'DEC-SWEEP-TRACKER'
    gate: 'issue sweep step 2'
    topic: 'Tracker issue for the batch table = issue #13'
    reason: 'SCOPE has four peer issues and no dedicated tracker. "Do not create new GitHub issues" forbids a new one, so the P1 issue (first in dependency order) carries the consolidated batch table; per-issue evidence stays on its own issue.'
    status: 'accepted'
  - id: 'DEC-SWEEP-BATCHES'
    gate: 'issue sweep step 2'
    topic: 'Batches A(#13) → B(#14) → C(#15) → D(#16), landed as separate PRs'
    reason: 'The harness exposes no parallel subagent dispatch, so cross-file parallelism cannot actually run concurrently; the batches keep one PR in flight at a time as step 4 requires, and each lands only after main is green.'
    status: 'accepted'
  - id: 'DEC-BUG007-FAVICON'
    gate: 'assess-impact / scope check'
    topic: 'BUG-007 also downscales the 4.1 MB icon.png and fixes hero CLS'
    reason: 'Lighthouse baseline shows icon.png is 4,134,861 B of 4,340 KiB total page weight and CLS 0.24. Issue #13 acceptance requires Lighthouse >= 90 on the live URL, which is unreachable while the favicon is 4.1 MB. Treating this as in-scope for #13 rather than a scope change; recorded in BUG-007.'
    status: 'accepted'
  - id: 'DEC-SWEEP-LANDING'
    gate: 'release-branch Gate'
    topic: 'Land via PR + squash merge instead of scripts/land-branch.sh'
    reason: 'CONVENTIONS nominates land-branch.sh, which pushes to main *and then* CI runs. A PR produces green checks before main moves, which is strictly safer and is explicitly within the standing approval. land-branch.sh duties (epic-capsule archive check, worktree removal, branch deletion) are performed manually per batch; nothing is force-pushed and main is never rewritten.'
    status: 'accepted'
  - id: 'DEC-BUG008-BLOCKED'
    gate: 'issue sweep step 4 — stop condition (external failure)'
    topic: 'Batch B (#14 / BUG-008) stopped before landing'
    reason: 'Netlify git integration is dead (no webhook, installation_id null, no build hook, newest deploy 2026-05-21). A post-deploy smoke gate cannot pass while no deploy exists, and shipping it would turn main red. Not weakened into an always-passing check. Owner action required (BUG-012).'
    status: 'accepted'
  - id: 'DEC-BUG011-FIX'
    gate: 'CONVENTIONS § Discovered Defects'
    topic: 'Fix validate-specs-yaml.sh archive fallback'
    reason: 'Reproducible gate failure on main (exit 1 on three archived capsules), same class as BUG-006. Trivial fix, verified exit 0.'
    status: 'accepted'
  - id: 'DEC-BUG013-FIX'
    gate: 'CONVENTIONS § Discovered Defects'
    topic: 'Untrack 28 committed .pyc files and ignore __pycache__'
    reason: 'Committed build artefacts polluted every diff that ran a python script. Removing them from the index changes no runtime behaviour.'
    status: 'accepted'
  - id: 'DEC-BUG009-UPSTREAM'
    gate: 'release-branch Gate (cross-repo)'
    topic: 'Shipped the trace-stories fix upstream and re-vendored it here'
    reason: 'PR danielvm-git/bigpowers#222 merged with all four gates green (sync, skill-verify, story-verify, verification-gates). Two gate rounds were needed: the fix first broke the golden G-10 zero-story anti-vacuity check and the documented all-todo contract, which had been satisfiable only because the 50-story baseline masked them. Both are now explicit, and scripts/test-trace-strict.sh fixtures assert the real `stories:` schema with a decoy `development_status:` key.'
    status: 'accepted'
  - id: 'DEC-SWEEP-REVIEW'
    gate: 'issue sweep step 6 — full-diff review'
    topic: 'Review pass found and fixed one documentation gap; nothing else new'
    reason: 'HP-1 of specs/HOT-PATH-AND-STATE-MACHINE-AUDIT.md still claimed Sentry.init() ran before app.mount(), and neither AGENTS.md nor CONVENTIONS.md named the new bundle budget, so the ceiling was invisible to future agents. Both fixed in PR #20. Known non-blocking observations left alone: sourcemaps are published with dist/ (harmless — the repo and site are MIT/public), and release tags carry no binary assets by design (postTagAssets commits files; it does not upload release assets).'
    status: 'accepted'
  - id: 'DEC-BUG012-NO-UNILATERAL-INFRA'
    gate: 'issue sweep — approval boundary'
    topic: 'Did not create a Netlify build hook or a repo secret to unblock #14'
    reason: 'Wiring the deploy back up is production infrastructure (Netlify GitHub App re-authorisation, a build hook, or a NETLIFY_AUTH_TOKEN secret). Creating credentials and re-enabling production deploys is outside the granted approval (commit/push/PR/merge/comment). Escalated on issue #14 with three concrete options instead.'
    status: 'accepted'
